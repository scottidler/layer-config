otto:
  api: 1
  tasks: [ci]
  envs:
    VERSION: "$(git describe --tags --always --dirty 2>/dev/null || echo 'dev')"

tasks:
  # Whitespace linting
  lint:
    help: "Run whitespace linting"
    bash: |
      whitespace -r

  # Code quality checks
  check:
    help: "Run all quality checks (compile, clippy, format)"
    bash: |
      echo "=== Checking compilation ==="
      cargo check --workspace --all-targets --all-features
      echo ""
      echo "=== Running Clippy ==="
      cargo clippy --workspace --all-targets --all-features -- -D warnings
      echo ""
      echo "=== Checking format ==="
      cargo fmt --all --check
      echo ""
      echo "✅ All checks passed!"

  # Run tests
  test:
    help: "Run all tests"
    bash: |
      cargo test --workspace --all-features

  # Run coverage tests and output data
  cov:
    help: "Run tests with coverage via llvm-cov"
    after: [cov-report]
    bash: |
      echo "Running tests with coverage..."

      JSON_FILE="$OTTO_TASK_DIR/coverage.json"

      # Run coverage
      TEST_FAILED=0
      if ! cargo llvm-cov --workspace --all-features --json --output-path "$JSON_FILE" 2>&1; then
        TEST_FAILED=1
      fi

      # Validate JSON was created
      if [ ! -s "$JSON_FILE" ] || ! jq -e '.data[0].totals' "$JSON_FILE" >/dev/null 2>&1; then
        echo "Tests failed - no coverage data generated"
        exit 1
      fi

      # Generate HTML report
      cargo llvm-cov report --html --output-dir target/llvm-cov/html >/dev/null 2>&1 || true

      # Output data for cov-report
      otto_set_output "json_path" "$JSON_FILE"
      otto_set_output "test_failed" "$TEST_FAILED"
      otto_set_output "lines_pct" "$(jq -r '.data[0].totals.lines.percent // 0' "$JSON_FILE")"
      otto_set_output "lines_cov" "$(jq -r '.data[0].totals.lines.covered // 0' "$JSON_FILE")"
      otto_set_output "lines_tot" "$(jq -r '.data[0].totals.lines.count // 0' "$JSON_FILE")"
      otto_set_output "funcs_pct" "$(jq -r '.data[0].totals.functions.percent // 0' "$JSON_FILE")"
      otto_set_output "funcs_cov" "$(jq -r '.data[0].totals.functions.covered // 0' "$JSON_FILE")"
      otto_set_output "funcs_tot" "$(jq -r '.data[0].totals.functions.count // 0' "$JSON_FILE")"
      otto_set_output "regions_pct" "$(jq -r '.data[0].totals.regions.percent // 0' "$JSON_FILE")"

  # Display coverage report (runs after cov)
  cov-report:
    help: "Display coverage report"
    params:
      --fail-under:
        default: "0"
        help: "Minimum line coverage percentage (0 = no threshold)"
      --json:
        default: "false"
        help: "Output raw JSON coverage data"
      --details:
        default: "false"
        help: "Show detailed per-file coverage"
    bash: |
      # Colors provided by otto builtins: RED, GREEN, YELLOW, BLUE, CYAN, MAGENTA, BOLD, DIM, NC

      color_pct() {
        local pct=$1
        local int_pct=${pct%.*}
        if [ "$int_pct" -ge 80 ]; then echo -e "${GREEN}${pct}%${NC}"
        elif [ "$int_pct" -ge 60 ]; then echo -e "${YELLOW}${pct}%${NC}"
        else echo -e "${RED}${pct}%${NC}"; fi
      }

      # Get data from cov task
      JSON_PATH=$(otto_get_input "cov.json_path")
      TEST_FAILED=$(otto_get_input "cov.test_failed")
      LINES_PCT=$(printf "%.1f" "$(otto_get_input "cov.lines_pct")")
      LINES_COV=$(otto_get_input "cov.lines_cov")
      LINES_TOT=$(otto_get_input "cov.lines_tot")
      FUNCS_PCT=$(printf "%.1f" "$(otto_get_input "cov.funcs_pct")")
      FUNCS_COV=$(otto_get_input "cov.funcs_cov")
      FUNCS_TOT=$(otto_get_input "cov.funcs_tot")
      REGIONS_PCT=$(printf "%.1f" "$(otto_get_input "cov.regions_pct")")

      # Raw JSON mode
      if [ "${json}" = "true" ]; then
        cat "$JSON_PATH"
        exit $TEST_FAILED
      fi

      # Detailed per-file coverage
      if [ "${details}" = "true" ]; then
        echo -e "${BOLD}${CYAN}Per-file Coverage:${NC}"
        echo -e "${DIM}────────────────────────────────────────────────────────${NC}"
        jq -r '.data[0].files[] | "\(.filename)|\(.summary.lines.percent // 0)|\(.summary.lines.covered // 0)|\(.summary.lines.count // 0)"' "$JSON_PATH" | \
        sort -t'|' -k2 -n | while IFS='|' read -r file pct covered total; do
          display=$(echo "$file" | sed 's|.*/src/||')
          [ ${#display} -gt 40 ] && display="...${display: -37}"
          int_pct=${pct%.*}
          if [ "$int_pct" -ge 80 ]; then color=$GREEN
          elif [ "$int_pct" -ge 60 ]; then color=$YELLOW
          else color=$RED; fi
          printf "  %-42s %b%6.1f%%%b %b(%d/%d)%b\n" "$display" "$color" "$pct" "$NC" "$DIM" "$covered" "$total" "$NC"
        done
        echo -e "${DIM}────────────────────────────────────────────────────────${NC}"
        echo ""
      fi

      # Summary
      echo -e "${BOLD}${CYAN}Coverage Summary${NC}"
      echo -e "${DIM}────────────────────────────────────────${NC}"
      echo -e "  ${BOLD}Lines:${NC}     $(color_pct $LINES_PCT)  ${DIM}(${LINES_COV}/${LINES_TOT})${NC}"
      echo -e "  ${BOLD}Functions:${NC} $(color_pct $FUNCS_PCT)  ${DIM}(${FUNCS_COV}/${FUNCS_TOT})${NC}"
      echo -e "  ${BOLD}Regions:${NC}   $(color_pct $REGIONS_PCT)"
      echo -e "${DIM}────────────────────────────────────────${NC}"
      echo ""

      # Threshold check
      THRESHOLD_FAILED=0
      if [ "${fail_under}" != "0" ]; then
        LINES_INT=${LINES_PCT%.*}
        THRESHOLD_INT=${fail_under%.*}
        if [ "$LINES_INT" -lt "$THRESHOLD_INT" ]; then
          THRESHOLD_FAILED=1
          echo -e "${RED}${BOLD}✗ Coverage ${LINES_PCT}% is below ${fail_under}% threshold${NC}"
        else
          echo -e "${GREEN}${BOLD}✓ Coverage ${LINES_PCT}% meets ${fail_under}% threshold${NC}"
        fi
        echo ""
      fi

      echo -e "${BLUE}Report:${NC} target/llvm-cov/html/index.html"

      [ "$TEST_FAILED" = "1" ] || [ "$THRESHOLD_FAILED" = "1" ] && exit 1 || true

  # Mutation testing: no args = whole workspace; --diff = scoped to a diff (NOT part of ci)
  mutants:
    help: "Mutation-test the workspace; --diff FILE scopes to a diff (CI use; NOT part of ci)"
    params:
      --diff:
        default: ""
        help: "Unified diff FILE: test only mutants in the changed lines"
      --shard:
        default: ""
        help: "Run shard k/N of the mutant set (round-robin); e.g. 0/4"
      --jobs:
        default: ""
        help: "Parallel mutant jobs (default 8; rejected with --in-place)"
      --in-place:
        default: false
        help: "Mutate this checkout instead of copying it per job (single job; CI uses this)"
    bash: |
      # Pinned so a toolchain refresh cannot change what "zero survivors" means. The reusable
      # mutants.yml exports MUTANTS_VERSION and installs the prebuilt binary first.
      # A stale `rc` from a prior run must not outlive a refused or failed run below.
      rm -f rc
      MUTANTS_VERSION="${MUTANTS_VERSION:-27.1.0}"
      have=$(cargo mutants --version 2>/dev/null | awk '{print $2}' || true)
      if [ "$have" != "$MUTANTS_VERSION" ]; then
        echo "installing cargo-mutants $MUTANTS_VERSION (found: ${have:-none})"
        cargo install cargo-mutants --version "$MUTANTS_VERSION" --locked
      fi

      # Every job gets its own workspace copy and target/. A RAM-backed /tmp fills and dies with
      # "No space left on device" after reporting zero survivors so far: a false green. Use a
      # disk-backed dir, and not one under a .git ancestor (tests that assert "not a repo" break).
      export TMPDIR="${TMPDIR_MUTANTS:-/var/tmp/layer-config-mutants}"
      mkdir -p "$TMPDIR"

      # --in-place is single-job; cargo-mutants rejects the pair, a clear message beats its usage dump.
      if [ "${in_place}" = "true" ] && [ -n "${jobs}" ]; then
        echo "mutants: --in-place and --jobs cannot be used together (--in-place runs one job)" >&2
        exit 2
      fi
      if [ "${in_place}" = "true" ]; then
        MUTANT_JOBS=1
        JOBS_ARGS=(--in-place)
      else
        MUTANT_JOBS="${jobs:-8}"
        JOBS_ARGS=(--jobs "$MUTANT_JOBS")
      fi
      # --jobs bounds concurrent mutants, not the threads each test binary spawns. A rayon pool
      # defaults to nproc per process, so cap it at cores/jobs or the timeout below is meaningless.
      CORES=$(nproc)
      export RAYON_NUM_THREADS=$(( CORES / MUTANT_JOBS > 0 ? CORES / MUTANT_JOBS : 1 ))
      echo "mutants: --jobs $MUTANT_JOBS x RAYON_NUM_THREADS=$RAYON_NUM_THREADS on $CORES cores"

      # --diff FILE is the scope; no --diff = the whole workspace.
      # A diff with no '+++ b/' header is refused: cargo-mutants matches paths by the a/ b/
      # prefixes, so a diff.mnemonicPrefix diff (i/ w/) lists 0 mutants and exits 0, a false green.
      SCOPE_ARGS=()
      if [ -n "${diff}" ]; then
        # Copy first: `--diff <(git diff)` is a pipe, readable once and never `-s`.
        diff_copy=$(mktemp)
        trap 'rm -f "$diff_copy"' EXIT
        cat "${diff}" > "$diff_copy"
        if [ -s "$diff_copy" ] && ! grep -q '^+++ ' "$diff_copy"; then
          echo "mutants: ${diff} is not a unified diff (no '+++' file header)" >&2
          exit 2
        fi
        # Every new-file header must be `+++ b/` (or /dev/null): one other prefix
        # silently drops that file from the mutant set.
        bad=$(grep '^+++ ' "$diff_copy" | grep -v -e '^+++ b/' -e '^+++ /dev/null' || true)
        if [ -n "$bad" ]; then
          echo "mutants: ${diff} has headers without the 'b/' prefix (e.g. '$(head -n1 <<< "$bad")'); regenerate it with 'git -c diff.mnemonicPrefix=false diff' (other prefixes match nothing and test nothing)" >&2
          exit 2
        fi
        SCOPE_ARGS=(--in-diff "$diff_copy")
      fi

      # round-robin: the default `slice` gives ceil(total/N) chunks, so a shard can be empty.
      SHARD_ARGS=()
      if [ -n "${shard}" ]; then
        SHARD_ARGS=(--shard "${shard}" --sharding round-robin)
      fi

      # --workspace is required: with default-members set, cargo-mutants scopes to those alone and
      # can test nothing while exiting 0. --timeout is explicit because the baseline-derived one
      # is measured idle, then mutants run parallel. Feature flags match `otto test`.
      # cargo-mutants' raw exit code goes to `rc` before this task exits non-zero: otto collapses
      # failures to 1, and the CI report job must tell 2 (missed), 3 (timeout), 4 (baseline failed),
      # 5/6 (diff mismatch/invalid) apart.
      rc=0
      cargo mutants --workspace --all-features --timeout 300 --annotations auto \
        "${SCOPE_ARGS[@]}" "${SHARD_ARGS[@]}" "${JOBS_ARGS[@]}" || rc=$?
      echo "$rc" > rc
      echo "mutants: cargo-mutants exit code $rc written to $(pwd)/rc"
      exit "$rc"

  # Full CI pipeline
  ci:
    help: "Full CI pipeline (lint + check + test in parallel)"
    before: [lint, check, test]
    bash: |
      echo "✅ All CI checks passed!"

  # Build release binaries
  build:
    help: "Build release binaries for all workspace members"
    bash: |
      cargo build --release --workspace
      echo "✅ Release build complete for all workspace members"

  # Clean build artifacts
  clean:
    help: "Clean build artifacts"
    bash: |
      cargo clean
      echo "✅ Build artifacts cleaned"

  # Install workspace binaries locally
  install:
    help: "Install all workspace binaries locally via cargo"
    bash: |
      for manifest in */Cargo.toml; do
        if [ -f "$manifest" ]; then
          dir=$(dirname "$manifest")
          echo "Installing from $dir..."
          cargo install --path "$dir" || echo "⚠️  Could not install $dir (might be a library)"
        fi
      done
      echo "✅ Workspace binaries installed to ~/.cargo/bin"

